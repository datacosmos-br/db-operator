name: Publish a container image

on:
  push:
  pull_request:
  release:
    types: [published, edited]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/db-operator

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # OPERATOR_VERSION is baked into the binary. Releases use the tag name,
      # branch/PR builds use the commit SHA. Untrusted-ish inputs flow through
      # env vars, never interpolated straight into the shell.
      - name: Resolve operator version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'value=%s\n' "$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Single source of truth for image tags and OCI labels.
      - name: Container image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=db-operator
            org.opencontainers.image.description=The DB Operator creates databases and makes them available in the cluster via Custom Resources.
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch build. Pushed on branch pushes and releases; pull requests
      # build only (validation) and never publish. A plain multi-arch manifest
      # is produced (provenance disabled) for the widest consumer compatibility.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPERATOR_VERSION=${{ steps.version.outputs.value }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the exact digest just built. Non-blocking: a newly disclosed CVE
      # never blocks a publish — the report is in the run log and the image is
      # signed, so the security posture stays auditable.
      - name: Trivy vulnerability scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Keyless signature (GitHub OIDC). One signature on the manifest digest
      # covers every tag, since all tags resolve to the same digest.
      - name: Sign the image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

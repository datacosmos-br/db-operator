name: Upstream sync

# Maintenance workflow (not the release action): on a schedule it checks
# db-operator/db-operator @ main and, when it has new commits, opens a pull
# request into our main. main has diverged (rewritten history + ClickHouse),
# so the sync is always reviewed and conflict-resolved through the PR — never
# auto-merged.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # push the upstream-sync branch
  pull-requests: write # open the sync PR

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Push via an SSH deploy key, not GITHUB_TOKEN: the App token is refused
          # when upstream touches .github/workflows/** ("refusing to allow a GitHub
          # App to ... update workflow ... without workflows permission"). A deploy
          # key is exempt and can mirror workflow files. Read-write; key in secrets.
          ssh-key: ${{ secrets.UPSTREAM_SYNC_DEPLOY_KEY }}

      # All values used in the script come from env, never interpolated
      # straight into the shell.
      - name: Open a sync PR when upstream has new commits
        # Prefer a PAT if provided (can create PRs on a fork); fall back to the App
        # token. The branch mirror below is the core function; PR creation is
        # best-effort, since GITHUB_TOKEN cannot create PRs on a fork.
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT || github.token }}
          UPSTREAM_URL: https://github.com/db-operator/db-operator.git
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "main already contains upstream/main — nothing to sync"
            exit 0
          fi

          # Keep the upstream-sync branch tracking upstream/main verbatim;
          # the PR carries the actual integration into main.
          git push --force origin "refs/remotes/upstream/main:refs/heads/upstream-sync"

          open=$(gh pr list --base main --head upstream-sync --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "a sync PR is already open"
          elif gh pr create --base main --head upstream-sync \
              --title "chore: sync upstream/main" \
              --body "Automated sync of db-operator/db-operator @ main into our main. Review and resolve conflicts before merging — do not auto-merge."; then
            echo "opened a new sync PR"
          else
            echo "::warning::Could not open the sync PR automatically. GITHUB_TOKEN cannot create pull requests on a fork; the upstream-sync branch is updated — open the PR manually, or add an UPSTREAM_SYNC_PAT secret (scope: repo + workflow)."
          fi

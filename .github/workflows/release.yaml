name: Release

# The only custom workflow for this fork: on a datacosmos release tag (e.g.
# 2.30.0-dc1), build and publish the multi-arch container image and cut the
# GitHub release. Nothing runs on branch pushes or pull requests.
on:
  push:
    tags:
      - "*-dc*"

permissions:
  contents: write # create the GitHub release
  packages: write # push the image to GHCR
  id-token: write # keyless cosign signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/db-operator

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Releases are cut from main only: a *-dc* tag must point at a commit
      # that is part of main's history, otherwise the release is rejected.
      - name: Ensure the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tags (*-dc*) must point at a commit on main"
            exit 1
          fi

      # Tags and OCI labels. The release tag drives everything; `latest` always
      # follows the newest release.
      - name: Container image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=db-operator
            org.opencontainers.image.description=The DB Operator creates databases and makes them available in the cluster via Custom Resources.
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch build. provenance disabled keeps a plain manifest list for
      # the widest consumer compatibility. The Containerfile compiles the Go
      # binary, so a broken build fails here and no release is cut.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPERATOR_VERSION=${{ github.ref_name }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Non-blocking scan of the exact digest — auditable, never blocks a release.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signature on the manifest digest — covers every tag.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            Multi-arch (linux/amd64, linux/arm64), cosign-signed.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse-instance
  labels:
    app: clickhouse-instance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse-instance
  template:
    metadata:
      labels:
        app: clickhouse-instance
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # No CLICKHOUSE_USER: the password is applied to the built-in
            # `default` user. Access management lets it CREATE USER / GRANT.
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.auth.password | quote }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
